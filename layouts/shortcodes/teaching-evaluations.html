<figure class="teaching-evaluations" aria-labelledby="evaluation-caption" aria-describedby="evaluation-method">
  <figcaption id="evaluation-caption" class="evaluation-intro">Average Course Median (out of 5).</figcaption>
  {{ range site.Data.teaching_evaluations.groups }}
    {{ $group := . }}
    <section class="evaluation-chart" aria-labelledby="evaluation-{{ .id }}">
      <div class="evaluation-heading">
        <h4 id="evaluation-{{ .id }}">{{ .title }}</h4>
        <span class="evaluation-coverage">{{ .coverage }}</span>
      </div>
      {{ range .rows }}
        <div class="evaluation-metric">
          <div class="evaluation-label">{{ .label }}</div>
          <div class="evaluation-bar-row" role="img" aria-label="{{ $group.title }} - {{ .label }}: {{ .personal }} out of 5">
            <div class="evaluation-track" aria-hidden="true">
              <span class="evaluation-bar" style="width: {{ mul (float .personal) 20 }}%"></span>
            </div>
            <span class="evaluation-value" aria-hidden="true">{{ .personal }}</span>
          </div>
        </div>
      {{ end }}
      <div class="evaluation-axis" aria-hidden="true"><div><span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span></div></div>
    </section>
  {{ end }}
  <p id="evaluation-method" class="evaluation-method">Source: University of Michigan instructor evaluation reports for the courses and terms listed. For each course level, scores are the unweighted averages of the medians in these reports.</p>
</figure>
