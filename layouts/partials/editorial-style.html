<style id="editorial-style">
  :root {
    --site-heading-font: Georgia, "Times New Roman", serif;
    --site-ink: #26323d;
    --site-text: #4b5563;
    --site-link: #345570;
    --site-rule: #dce1e5;
    --site-hover: #f3f5f7;
    --color-primary-50: 243 246 249;
    --color-primary-100: 228 236 243;
    --color-primary-200: 205 220 233;
    --color-primary-300: 176 199 221;
    --color-primary-400: 127 160 188;
    --color-primary-500: 86 122 153;
    --color-primary-600: 64 101 132;
    --color-primary-700: 52 85 112;
    --color-primary-800: 42 65 85;
    --color-primary-900: 33 49 64;
    --color-primary-950: 23 34 45;
  }

  .dark {
    --site-ink: #e5e9ef;
    --site-text: #c0c8d2;
    --site-link: #b0c7dd;
    --site-rule: #374151;
    --site-hover: #263241;
  }

  .navbar-brand {
    font-family: var(--site-heading-font);
    font-weight: 600;
    color: var(--site-ink);
  }

  .nav-link {
    font-weight: 500;
  }

  .nav-link:hover,
  .nav-link.active {
    color: var(--site-link);
    text-decoration: underline;
    text-decoration-thickness: 1px;
    text-underline-offset: 0.4em;
  }

  .page-body h1,
  .prose h2,
  .prose h3,
  .prose h4 {
    font-family: var(--site-heading-font);
    color: var(--site-ink);
    font-weight: 600;
    line-height: 1.3;
    text-wrap: pretty;
  }

  .page-body h1 {
    font-size: clamp(2rem, 1.7rem + 1vw, 2.65rem);
  }

  .prose h2,
  .prose h3 {
    font-size: clamp(1.4rem, 1.25rem + 0.5vw, 1.75rem);
    margin-top: 2.2rem;
    margin-bottom: 1rem;
  }

  .prose p,
  .prose li {
    color: var(--site-text);
    font-size: 1rem;
    line-height: 1.75;
  }

  .prose strong {
    color: var(--site-ink);
    font-weight: 600;
  }

  .prose :is(p, li) a {
    color: var(--site-link);
    text-decoration-thickness: 1px;
    text-underline-offset: 0.2em;
  }

  .prose :is(p, li) a:hover {
    color: var(--site-ink);
    text-decoration-thickness: 2px;
  }

  .prose a:focus-visible,
  .navbar a:focus-visible {
    outline: 2px solid var(--site-link);
    outline-offset: 4px;
  }

  .prose a strong {
    color: inherit;
  }

  /* The section template used by Teaching needs its own mobile gutter. */
  .page-body > .max-w-prose {
    width: 100%;
    padding-inline: 1.5rem;
  }

  {{ if in (slice "/talks/" "/teaching/") .RelPermalink }}
  .prose > ul {
    list-style: none;
    padding-left: 0;
    margin-top: 0;
  }

  .prose > ul > li {
    margin: 0;
    padding: 0.9rem 0;
    border-top: 1px solid var(--site-rule);
  }
  {{ end }}

  {{ if ne .RelPermalink "/research/" }}
  .prose blockquote {
    margin: 1.4rem 0 2rem;
    padding: 0;
    border: 0;
    background: none;
    box-shadow: none;
    font-style: normal;
    font-weight: 400;
  }

  .prose blockquote p {
    margin: 0;
    padding: 1.3rem 0;
    border-top: 1px solid var(--site-rule);
    font-family: var(--site-heading-font);
    font-size: 1.125rem;
    line-height: 1.8;
  }

  .prose blockquote p::before,
  .prose blockquote p::after {
    content: none;
  }

  .prose blockquote .student-comment-source {
    display: block;
    margin-top: 0.65rem;
    font-family: var(--font-sans, ui-sans-serif, sans-serif);
    font-size: 0.875rem;
    line-height: 1.5;
  }
  {{ end }}
</style>
